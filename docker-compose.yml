services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: navori_publisher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d navori_publisher"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "--import", "tsx", "src/db/migrate.ts"]
    environment: &app-env
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/navori_publisher
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET zorunludur}
      OPENAI_API_ENABLED: ${OPENAI_API_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      NAVORI_API_ENABLED: ${NAVORI_API_ENABLED:-false}
      NAVORI_BASE_URL: ${NAVORI_BASE_URL:-}
      NAVORI_USERNAME: ${NAVORI_USERNAME:-}
      NAVORI_PASSWORD: ${NAVORI_PASSWORD:-}
      NAVORI_ALLOWED_HOSTS: ${NAVORI_ALLOWED_HOSTS:-}
      TEMP_UPLOAD_PATH: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    environment: *app-env
    ports:
      - "3000:3000"
    volumes:
      - upload-data:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["node", "--import", "tsx", "src/worker.ts"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - upload-data:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  upload-data:
